# /etc/nginx/sites-available/eumetria.example.com — see the README, "Setup on a server".
# certbot --nginx adds the HTTPS server block and the redirect.

# Per-IP limits: sign-ins strictly (the app also locks an account after 5
# wrong passwords), the rest of the API loosely (the page polls it while a
# sync runs).
limit_req_zone $binary_remote_addr zone=eumetria_login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=eumetria_api:1m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name eumetria.example.com;

    client_max_body_size 1k;

    gzip on;
    gzip_proxied any;
    gzip_types application/json application/manifest+json text/css text/javascript application/javascript image/svg+xml;

    location /api/login {
        limit_req zone=eumetria_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        include proxy_params;
    }

    # Workout notes: text, and images up to 3 MB as base64 in JSON. No slash at
    # the end: nginx would answer /api/notes, the list, with a redirect.
    location /api/notes {
        client_max_body_size 5m;
        limit_req zone=eumetria_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        include proxy_params;
    }

    # A profile picture, as base64 in JSON.
    location = /api/profile/avatar {
        client_max_body_size 5m;
        limit_req zone=eumetria_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        include proxy_params;
    }

    # The settings: small, but more than the rest of the API sends.
    location = /api/admin/settings {
        client_max_body_size 8k;
        limit_req zone=eumetria_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        include proxy_params;
    }

    location /api/ {
        limit_req zone=eumetria_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        include proxy_params;
    }
}
