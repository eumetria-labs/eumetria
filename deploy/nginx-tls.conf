# /etc/nginx/sites-available/eumetria.example.com, HTTPS version written by
# hand (README, "Setup on a server", step 4). Use it when certbot's nginx plugin can't
# edit the config; the certificate itself comes from certbot.

# Per-IP limits: sign-ins strictly (the app also locks an account after 5
# wrong passwords), the rest of the API loosely (the page polls it while a
# sync runs).
limit_req_zone $binary_remote_addr zone=eumetria_login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=eumetria_api:1m rate=120r/m;
# Requests in progress per IP, where each one costs the app memory: a
# password check (19 MiB) or an image upload. The app has its own limits
# (pentest re-test N1, N3); this keeps one address from taking them all.
limit_conn_zone $binary_remote_addr zone=eumetria_conn:1m;

server {
    listen 80;
    listen [::]:80;
    server_name eumetria.example.com;

    # Let's Encrypt renewals (certbot --webroot -w /var/www/letsencrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name eumetria.example.com;

    ssl_certificate     /etc/letsencrypt/live/eumetria.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eumetria.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1k;

    gzip on;
    gzip_proxied any;
    gzip_types application/json application/manifest+json text/css text/javascript application/javascript image/svg+xml;

    location /api/login {
        # No nodelay: a burst waits its turn instead of arriving at once.
        limit_req zone=eumetria_login burst=5;
        limit_req_status 429;
        limit_conn eumetria_conn 2;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8090;
        include proxy_params;
    }

    # Workout notes: text, and images up to 3 MB as base64 in JSON. No slash at
    # the end: nginx would answer /api/notes, the list, with a redirect.
    location /api/notes {
        client_max_body_size 5m;
        limit_req zone=eumetria_api burst=30 nodelay;
        limit_req_status 429;
        limit_conn eumetria_conn 4;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8090;
        include proxy_params;
    }

    # A profile picture, as base64 in JSON.
    location = /api/profile/avatar {
        client_max_body_size 5m;
        limit_req zone=eumetria_api burst=30 nodelay;
        limit_req_status 429;
        limit_conn eumetria_conn 4;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8090;
        include proxy_params;
    }

    # The settings: small, but more than the rest of the API sends.
    location = /api/admin/settings {
        client_max_body_size 8k;
        limit_req zone=eumetria_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        include proxy_params;
    }

    location /api/ {
        limit_req zone=eumetria_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        include proxy_params;
    }
}
