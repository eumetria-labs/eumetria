# /etc/nginx/sites-available/eumetria.example.com, HTTPS version written by
# hand (README, "Setup on a server", step 4). Use it when certbot's nginx plugin can't
# edit the config; the certificate itself comes from certbot.

# Per-IP limit for the sync API (the app also locks out after 5 wrong tokens).
limit_req_zone $binary_remote_addr zone=eumetria_api:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name eumetria.example.com;

    # Let's Encrypt renewals (certbot --webroot -w /var/www/letsencrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name eumetria.example.com;

    ssl_certificate     /etc/letsencrypt/live/eumetria.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eumetria.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1k;

    gzip on;
    gzip_proxied any;
    gzip_types application/json application/manifest+json text/css text/javascript application/javascript image/svg+xml;

    location /api/ {
        limit_req zone=eumetria_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        include proxy_params;
    }
}
