# Tests for every push and pull request; on main, the container image,
# pushed to GitHub's registry as :latest and :<short commit>: the edge
# channel, newest commit first (docs: operations/updates). Releases, the
# :1 / :1.2 / :1.2.3 tags, come from release.yml.
#
# Also weekly, so the image gets Go's patch releases (and the base image's
# fixes) in weeks without a push, and govulncheck looks at the code again:
# GitHub mails when a scheduled run fails (pentest F13).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v7
      # The newest 1.27 patch release, as the image build uses (golang:1.27).
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: go vet ./...
      - run: go test ./...
      - run: node --test tests/*.test.js
      # Sample data, then the page in headless Chrome (preinstalled on the
      # runner; its version in the log, for when a new runner image breaks it).
      - run: google-chrome --version
      - run: go run ./cmd/eumetria -demo -out site/stats.json
      - run: node scripts/smoke.js site
        env:
          CHROME_BIN: google-chrome
      # The account menu and the Profile / Settings view, against a running
      # demo server with an admin and a viewer (the smoke test has no accounts).
      - run: go build -o "$RUNNER_TEMP/eumetria" ./cmd/eumetria && node scripts/prefs-check.js "$RUNNER_TEMP/eumetria"
        env:
          CHROME_BIN: google-chrome

  # Known vulnerabilities in the code's call paths, with the newest Go. Not
  # a step the image waits for: a new advisory without a fix yet shouldn't
  # stop a deploy, but the run turns red and says what to update.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # One push at a time, so :latest always ends up on the newest commit.
    concurrency:
      group: image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "schema=$(ls internal/db/migrations/*.sql | wc -l)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          build-args: |
            VERSION=main-${{ steps.tag.outputs.short }}
            REVISION=${{ github.sha }}
            SCHEMA=${{ steps.tag.outputs.schema }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The optional Claude Code runner (deploy/claude-runner).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/claude-runner/Dockerfile
          pull: true
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-claude-runner:latest
            ghcr.io/${{ github.repository }}-claude-runner:${{ steps.tag.outputs.short }}
          cache-from: type=gha,scope=runner
          cache-to: type=gha,mode=max,scope=runner
      # The updater (deploy/updater): in-place updates from Settings → Update.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/updater/Dockerfile
          pull: true
          push: true
          build-args: |
            VERSION=main-${{ steps.tag.outputs.short }}
            REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}-updater:latest
            ghcr.io/${{ github.repository }}-updater:${{ steps.tag.outputs.short }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater
