# Tests for every push and pull request; on main, the container image the
# server runs (README, "Setup on a server"), pushed to GitHub's registry as
# :latest and :<short commit>. The server's nightly cron pulls :latest.
#
# Also weekly, so the image gets Go's patch releases (and the base image's
# fixes) in weeks without a push, and govulncheck looks at the code again:
# GitHub mails when a scheduled run fails (pentest F13).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v7
      # The newest 1.26 patch release, as the image build uses (golang:1.26).
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: go vet ./...
      - run: go test ./...
      - run: node --test tests/*.test.js
      # Sample data, then the page in headless Chrome (preinstalled on the runner).
      - run: go run ./cmd/eumetria -demo -out site/stats.json
      - run: node scripts/smoke.js site
        env:
          CHROME_BIN: google-chrome

  # Known vulnerabilities in the code's call paths, with the newest Go. Not
  # a step the image waits for: a new advisory without a fix yet shouldn't
  # stop a deploy, but the run turns red and says what to update.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # One push at a time, so :latest always ends up on the newest commit.
    concurrency:
      group: image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
