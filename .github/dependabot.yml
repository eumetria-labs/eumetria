# Updates proposed as pull requests: the pinned base image (Dockerfile), the
# GitHub Actions and the Go modules. CI tests each one.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
